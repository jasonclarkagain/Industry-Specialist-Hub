kind = "web"
previewPath = "/"
title = "Build With Clark"
version = "1.0.0"
id = "artifacts/build-with-clark"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 20269

[services.development]
run = "pnpm --filter @workspace/build-with-clark run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/build-with-clark", "run", "build" ]
publicDir = "artifacts/build-with-clark/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "20269"
BASE_PATH = "/"
