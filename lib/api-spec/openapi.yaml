openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: contact
    description: Contact form submissions
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /preview-generator:
    post:
      operationId: generatePreview
      tags: [preview]
      summary: Generate a landing page preview
      description: Uses AI to generate a mini landing page concept for a business
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PreviewGeneratorInput"
      responses:
        "200":
          description: Generated preview
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PreviewGeneratorResult"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /contact:
    post:
      operationId: submitContact
      tags: [contact]
      summary: Submit contact form
      description: Accepts a contact form submission from a potential client
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ContactInput"
      responses:
        "201":
          description: Submission received
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContactSubmission"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    get:
      operationId: listContacts
      tags: [contact]
      summary: List contact submissions
      description: Returns all contact form submissions
      responses:
        "200":
          description: List of submissions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ContactSubmission"
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    PreviewGeneratorInput:
      type: object
      required:
        - businessName
        - businessType
      properties:
        businessName:
          type: string
          minLength: 1
          maxLength: 100
        businessType:
          type: string
          minLength: 1
          maxLength: 100
        tagline:
          type: ["string", "null"]
          maxLength: 200
    PreviewGeneratorResult:
      type: object
      required:
        - headline
        - subheadline
        - description
        - services
        - callToAction
        - accentColor
      properties:
        headline:
          type: string
        subheadline:
          type: string
        description:
          type: string
        services:
          type: array
          items:
            type: object
            required:
              - title
              - description
            properties:
              title:
                type: string
              description:
                type: string
        callToAction:
          type: string
        accentColor:
          type: string
    ContactInput:
      type: object
      required:
        - name
        - email
        - message
        - projectType
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        email:
          type: string
          format: email
          maxLength: 200
        phone:
          type: ["string", "null"]
          maxLength: 30
        message:
          type: string
          minLength: 1
          maxLength: 2000
        projectType:
          type: string
          enum:
            - "Brand new website"
            - "Redesign existing site"
            - "Add features to my site"
            - "Not sure yet"
    ContactSubmission:
      type: object
      required:
        - id
        - name
        - email
        - message
        - projectType
        - createdAt
      properties:
        id:
          type: integer
        name:
          type: string
        email:
          type: string
        phone:
          type: ["string", "null"]
        message:
          type: string
        projectType:
          type: string
        createdAt:
          type: string
          format: date-time
    ErrorResponse:
      type: object
      required:
        - error
      properties:
        error:
          type: string
